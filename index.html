<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madrasah Menfess - Mention & Confess</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #046307; /* Hijau Madrasah / NU */
            --primary-dark: #024504;
            --accent: #FFC107;
            --bg-color: #f4f7f6;
            --text-color: #333;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--white);
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .admin-btn-top {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.3s;
        }

        .admin-btn-top:hover {
            background: rgba(255,255,255,0.4);
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: var(--white);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        /* Form Kirim Pesan */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: var(--primary-dark);
        }

        .form-group textarea, .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group textarea:focus, .form-group input:focus {
            border-color: var(--primary);
        }

        textarea {
            resize: vertical;
            height: 120px;
        }

        .btn {
            background-color: var(--primary);
            color: var(--white);
            border: none;
            padding: 12px 20px;
            width: 100%;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        /* Tampilan Feed Publik / Dashboard Admin */
        .section-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .menfess-item {
            background: #fff;
            border-left: 5px solid var(--primary);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: relative;
        }

        .menfess-target {
            font-size: 0.8rem;
            color: #666;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .menfess-text {
            font-size: 0.95rem;
            color: #333;
            word-break: break-word;
        }

        .menfess-date {
            font-size: 0.75rem;
            color: #999;
            text-align: right;
            margin-top: 8px;
        }

        .delete-btn {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.75rem;
            position: absolute;
            top: 15px;
            right: 15px;
        }

        /* Modal Login Admin */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        .alert {
            padding: 10px;
            background-color: #d4edda;
            color: #155724;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <button class="admin-btn-top" onclick="openLoginModal()"><i class="fas fa-lock"></i> Admin Login</button>
        <h1>🕌 Madrasah Menfess</h1>
        <p>Kirim aspirasi, kritik, saran, atau curhatan anonim secara aman di sini!</p>
    </header>

    <div class="container">
        <!-- FORM PENGIRIMAN -->
        <div id="user-view">
            <div class="card">
                <div id="alertBox" class="alert">Pesan berhasil dikirim secara anonim!</div>
                <form id="menfessForm" onsubmit="handleSend(event)">
                    <div class="form-group">
                        <label for="target">Untuk Siapa? (Contoh: Kakak Kelas X, Wali Kelas, Kantin, dll)</label>
                        <input type="text" id="target" placeholder="Cth: Bu Siti / Teman Seperjuangan" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Pesan / Curhatan Anonim</label>
                        <textarea id="message" placeholder="Tulis aspirasi, kritik, saran, atau curhatanmu di sini..." required></textarea>
                    </div>
                    <button type="submit" class="btn"><i class="fas fa-paper-plane"></i> Kirim Anonim</button>
                </form>
            </div>

            <!-- FEED PUBLIK (Opsional: Menampilkan pesan yang sudah dikirim) -->
            <div class="section-title">
                <span><i class="fas fa-comments"></i> Menfess Terbaru</span>
            </div>
            <div id="publicFeed">
                <!-- Pesan akan dimuat di sini secara dinamis -->
            </div>
        </div>

        <!-- DASHBOARD ADMIN (Tersembunyi Awalnya) -->
        <div id="admin-view" class="hidden">
            <div class="card" style="border-top: 5px solid var(--accent);">
                <div class="section-title">
                    <span><i class="fas fa-user-shield"></i> Dashboard Admin</span>
                    <button class="btn" style="width: auto; padding: 5px 10px; font-size: 0.8rem;" onclick="logoutAdmin()">Logout</button>
                </div>
                <p style="font-size: 0.9rem; margin-bottom: 15px; color: #666;">Kelola semua pesan masuk dari warga madrasah.</p>
            </div>
            
            <div id="adminFeed">
                <!-- List pesan untuk admin -->
            </div>
        </div>
    </div>

    <!-- MODAL PASSWORD ADMIN -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeLoginModal()">&times;</span>
            <h3 style="margin-bottom: 15px; color: var(--primary);">Login Admin</h3>
            <div class="form-group">
                <input type="password" id="adminPassword" placeholder="Masukkan Password Admin">
            </div>
            <button class="btn" onclick="verifyAdmin()">Masuk</button>
        </div>
    </div>

    <script>
        // Inisialisasi Data dari LocalStorage
        function getMessages() {
            let messages = localStorage.getItem('madrasah_menfess');
            return messages ? JSON.parse(messages) : [];
        }

        function saveMessages(messages) {
            localStorage.setItem('madrasah_menfess', JSON.stringify(messages));
        }

        // Handle Kirim Pesan
        function handleSend(e) {
            e.preventDefault();
            const target = document.getElementById('target').value;
            const message = document.getElementById('message').value;
            const date = new Date().toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });

            const newMessage = {
                id: Date.now(),
                target: target,
                message: message,
                date: date
            };

            const messages = getMessages();
            messages.unshift(newMessage); // Masukkan ke urutan paling atas
            saveMessages(messages);

            // Reset Form & Tampilkan Notifikasi
            document.getElementById('menfessForm').reset();
            const alertBox = document.getElementById('alertBox');
            alertBox.style.display = 'block';
            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 3000);

            loadPublicFeed();
        }

        // Tampilkan Feed Publik
        function loadPublicFeed() {
            const messages = getMessages();
            const feedContainer = document.getElementById('publicFeed');
            
            if (messages.length === 0) {
                feedContainer.innerHTML = `<p style="text-align: center; color: #777; padding: 20px;">Belum ada menfess yang dikirim. Jadilah yang pertama!</p>`;
                return;
            }

            feedContainer.innerHTML = messages.map(msg => `
                <div class="menfess-item">
                    <div class="menfess-target">To: ${escapeHtml(msg.target)}</div>
                    <div class="menfess-text">${escapeHtml(msg.message)}</div>
                    <div class="menfess-date">${msg.date}</div>
                </div>
            `).join('');
        }

        // Modal Control
        function openLoginModal() {
            document.getElementById('loginModal').style.display = 'flex';
        }

        function closeLoginModal() {
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('adminPassword').value = '';
        }

        // Verifikasi Password Admin
        function verifyAdmin() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === "Adiwiyata") {
                closeLoginModal();
                document.getElementById('user-view').classList.add('hidden');
                document.getElementById('admin-view').classList.remove('hidden');
                loadAdminFeed();
            } else {
                alert("Password Salah!");
            }
        }

        function logoutAdmin() {
            document.getElementById('admin-view').classList.add('hidden');
            document.getElementById('user-view').classList.remove('hidden');
            loadPublicFeed();
        }

        // Tampilkan Dashboard Admin
        function loadAdminFeed() {
            const messages = getMessages();
            const adminFeedContainer = document.getElementById('adminFeed');

            if (messages.length === 0) {
                adminFeedContainer.innerHTML = `<div class="card"><p style="text-align: center; color: #777;">Tidak ada pesan masuk.</p></div>`;
                return;
            }

            adminFeedContainer.innerHTML = messages.map(msg => `
                <div class="menfess-item">
                    <button class="delete-btn" onclick="deleteMessage(${msg.id})"><i class="fas fa-trash"></i> Hapus</button>
                    <div class="menfess-target">To: ${escapeHtml(msg.target)}</div>
                    <div class="menfess-text">${escapeHtml(msg.message)}</div>
                    <div class="menfess-date">${msg.date}</div>
                </div>
            `).join('');
        }

        // Hapus Pesan (Admin)
        function deleteMessage(id) {
            if (confirm("Yakin ingin menghapus pesan ini?")) {
                let messages = getMessages();
                messages = messages.filter(msg => msg.id !== id);
                saveMessages(messages);
                loadAdminFeed();
            }
        }

        // Fungsi Keamanan untuk Mencegah XSS Sederhana
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // Load data saat pertama kali dibuka
        window.onload = function() {
            loadPublicFeed();
        };
    </script>
</body>
</html>
